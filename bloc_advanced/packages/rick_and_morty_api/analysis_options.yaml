include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # These rules push syntax that only landed in Dart 3.13 (`new` constructor
    # names, `;` class bodies, private named parameters). Keep the familiar
    # syntax, since this is a learning example.
    unnecessary_type_name_in_constructor: false
    empty_container_bodies: false
    prefer_initializing_formals: false
